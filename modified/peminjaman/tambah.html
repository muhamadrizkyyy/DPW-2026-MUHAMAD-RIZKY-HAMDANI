<body>
    <header>

        <nav>

    <main>
        <section>
            <h2>Ajukan Peminjaman</h2>
            <p>Form untuk mengajukan peminjaman..</p>
        </section>
        <section>
            <form id="form-tambah">
                <p>
                    <label for="nama">Nama Peminjam</label><br>
                    <input type="text" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="asal">Asal</label><br>
                    <input type="text" id="asal" name="asal" required>
                </p>
                <p>
                    <label for="no_hp">No. HP</label><br>
                    <input type="text" id="no_hp" name="no_hp" required>
                </p>
                <p>
                    <label for="tgl_kembali">Tanggal Kembali</label><br>
                    <input type="date" id="tgl_kembali" name="tgl_kembali">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>
